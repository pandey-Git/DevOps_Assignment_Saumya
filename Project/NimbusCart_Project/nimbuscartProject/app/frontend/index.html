<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NimbusCart</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 8px; }
    form { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 10px; margin: 20px 0; }
    input, button { padding: 10px; font-size: 14px; }
    button { cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background: #f4f4f4; }
    #error { color: #b00020; min-height: 20px; }
  </style>
</head>
<body>
  <h1>NimbusCart</h1>
  <p>Three-tier AWS product catalog.</p>

  <h2>Add product</h2>
  <form id="product-form">
    <input id="name" name="name" placeholder="Product name" required>
    <input id="price" name="price" type="number" step="0.01" min="0" placeholder="Price" required>
    <input id="stock" name="stock" type="number" min="0" placeholder="Stock" required>
    <button type="submit">Add</button>
  </form>

  <div id="error"></div>

  <h2>Products</h2>
  <table>
    <thead><tr><th>Name</th><th>Price</th><th>Stock</th></tr></thead>
    <tbody id="items"></tbody>
  </table>

  <script>
    const errorBox = document.getElementById('error');
    const tbody = document.getElementById('items');
    const form = document.getElementById('product-form');

    function showError(message) { errorBox.textContent = message || ''; }

    async function loadItems() {
      try {
        const response = await fetch('/api/items');
        if (!response.ok) throw new Error('GET /api/items failed');
        const items = await response.json();
        tbody.innerHTML = items.map(item =>
          `<tr><td>${item.name}</td><td>₹${Number(item.price).toFixed(2)}</td><td>${item.stock}</td></tr>`
        ).join('');
        showError('');
      } catch (err) {
        showError('Could not load products. ' + err.message);
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const payload = {
        name: document.getElementById('name').value.trim(),
        price: Number(document.getElementById('price').value),
        stock: Number(document.getElementById('stock').value)
      };
      try {
        const response = await fetch('/api/items', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!response.ok) {
          const body = await response.json().catch(() => ({}));
          throw new Error(body.error || 'POST /api/items failed');
        }
        form.reset();
        await loadItems();
      } catch (err) {
        showError('Could not add product. ' + err.message);
      }
    });

    loadItems();
  </script>
</body>
</html>
